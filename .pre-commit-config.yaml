# StoryForgeAI pre-commit 钩子配置
# 安装: pre-commit install
# 手动触发全部: pre-commit run --all-files
#
# 说明:
# - M4-T14 旧代码归零后，Python 链路（Flask / pytest / run_checks.py）已删除，
#   钩子改为 Node 质量门禁（pnpm quality = 契约构建 + lint + build）。
# - language: system 直接复用当前 Node 环境；pnpm quality 等价于 CI 的静态门禁。

repos:
  # Node 质量门禁（契约构建 + lint + build），退出码非 0 即失败
  - repo: local
    hooks:
      - id: node-quality
        name: Node 质量门禁（contracts build / lint / build）
        entry: pnpm quality
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
