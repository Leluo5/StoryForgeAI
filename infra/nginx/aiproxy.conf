worker_processes 1;
daemon off;

events { worker_connections 64; }

http {
    default_type application/json;
    client_max_body_size 16m;

    # FastGPT v4.17 起所有模型调用（含 embedding）统一经 AIPROXY_API_ENDPOINT 代理。
    # 本地演示不部署官方 AIProxy 组件，用本 nginx 把 /aiproxy/v1/* 转发到 Ollama
    # 的 OpenAI 兼容端点 /v1/*（剥离 /aiproxy 前缀），补齐占位地址无法自举的问题。
    server {
        listen 3001;

        location /aiproxy/ {
            proxy_pass http://ollama:11434/;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location / {
            return 404 '{"error":"not found"}';
        }
    }
}