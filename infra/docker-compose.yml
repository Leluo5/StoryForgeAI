# 独立 project name，避免与 car-link 的 compose（同目录 infra/）共用 project `infra` 导致容器/卷互相覆盖
name: storyforge

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: storyforge
      POSTGRES_PASSWORD: storyforge
      POSTGRES_DB: storyforge
    ports:
      - "5433:5432"
    volumes:
      - storyforge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyforge -d storyforge"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  # 复用既有数据卷（原 project `infra` 下创建），必须 external 才能复用，避免 project 改名后新建空卷
  storyforge_pg:
    name: infra_storyforge_pg
    external: true
