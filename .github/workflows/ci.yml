name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# 只读仓库内容；paths-filter 读取 PR 变更文件列表需要 pull-requests: read
permissions:
  contents: read
  pull-requests: read

# 同一分支/PR 的新提交会立即取消上一次仍在运行的 CI，避免过期运行继续占用免费额度（闲置资源自动终止）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 变更范围识别：docs-only 提交与只影响单一模块的 PR 不再触发全量重活
  changes:
    name: 变更范围识别
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.flags.outputs.docs_only }}
      legacy: ${{ steps.flags.outputs.legacy }}
      e2e: ${{ steps.flags.outputs.e2e }}
      full: ${{ steps.flags.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'modules/**'
              - 'tests/**'
              - 'scripts/**'
              - 'config/**'
              - 'infra/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'playwright.config.ts'
              - 'requirements.txt'
              - '.github/**'
              - '**/*.py'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.mjs'
              - '**/*.json'
            legacy:
              - 'modules/**'
              - 'config/**'
              - 'scripts/**'
              - 'tests/**'
              - 'app.py'
              - '**/*.py'
              - 'requirements.txt'
              - '.github/**'
            e2e:
              - 'apps/**'
              - 'packages/**'
              - 'tests/**'
              - 'playwright.config.ts'
              - 'infra/**'
              - 'pnpm-lock.yaml'
              - '.github/**'
      - name: Compute run flags
        id: flags
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            code='true'
            legacy='true'
            e2e='true'
          else
            code='${{ steps.filter.outputs.code }}'
            legacy='${{ steps.filter.outputs.legacy }}'
            e2e='${{ steps.filter.outputs.e2e }}'
          fi
          # 无代码变更（纯文档/图片）时跳过全部重活
          if [ "$code" = "true" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
          echo "legacy=$legacy" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          # 合入主干（push / 手动触发）always 全量验收；PR 在模块全覆盖时才跑全量验收报告
          if [ "$code" = "true" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "true" ] && [ "$legacy" = "true" ] && [ "$e2e" = "true" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

  # 纯文档变更：不做全量门禁，但保留一个快速绿色信号，避免 PR 卡在“等待状态上报”
  docs:
    name: 文档变更快速通过
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Skip heavy gates
        run: echo "仅文档/静态资源变更，跳过代码门禁与浏览器验收"

  # 快速静态门禁：lint（等价于 typecheck）+ build，命中 pnpm 缓存后约 1 分钟
  quality:
    name: 静态质量门禁（lint / typecheck / build）
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "22.16.0"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      # 各包 lint 与 typecheck 均为 tsc --noEmit，CI 只跑一次类型检查（root scripts.quality）
      - name: Run static gates
        run: pnpm verify:m1
        env:
          M1_STAGES: quality
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-evidence-quality
          path: test-results/m1-evidence/
          retention-days: 7
          if-no-files-found: ignore

  # 单元与 API E2E 门禁 + 迁移幂等 + 数据库故障验收（共享同一套 PG/Redis，避免重复拉起容器）
  test:
    name: 单元与 API E2E 测试（vitest）
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://storyforge:storyforge@127.0.0.1:5433/storyforge_test
      TEST_DATABASE_URL: postgresql://storyforge:storyforge@127.0.0.1:5433/storyforge_test
      REDIS_URL: redis://127.0.0.1:6380
      # 仓库未配置 M0_AUTHOR_* secret 时回退到内置测试账号；prepare-e2e 会在测试库自举该 author（幂等）
      AUTHOR_EMAIL: ${{ secrets.M0_AUTHOR_EMAIL || 'ci-author@example.com' }}
      AUTHOR_DISPLAY_NAME: M1 CI Author
      AUTHOR_PASSWORD: ${{ secrets.M0_AUTHOR_PASSWORD || 'ci-author-pass-1234' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "22.16.0"
      # infra/docker-compose.yml 将 storyforge_pg 标为 external（复用本地数据卷），CI 干净环境需预先创建，否则 compose up 失败
      - name: Start disposable pgvector PostgreSQL 16 and Redis 7
        run: |
          docker volume create infra_storyforge_pg
          docker compose -f infra/docker-compose.yml up -d postgres --wait
          docker compose -f infra/docker-compose.yml exec -T postgres psql -U storyforge -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE storyforge_test"
          docker compose -f infra/docker-compose.yml up -d redis --wait
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check required author secrets without printing them
        run: node -e "for (const key of ['AUTHOR_EMAIL','AUTHOR_PASSWORD']) { if (!process.env[key]) throw new Error(key + ' repository secret is required'); }"
      - name: Run database-backed gates
        run: pnpm verify:m1
        env:
          M1_STAGES: docker,migration-fresh,migration-second,knowledge-migration,unit-test,database-failure
          M1_ALLOW_DATABASE_RESTART: "1"
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-evidence-test
          path: test-results/m1-evidence/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-api-e2e-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # 旧体系 Python 门禁：四类合规检查 + pytest + 语法编译，与前端/浏览器任务完全并行
  legacy:
    name: 旧体系 Python 门禁（合规 / pytest / 编译）
    needs: changes
    if: needs.changes.outputs.docs_only == 'false' && (needs.changes.outputs.legacy == 'true' || needs.changes.outputs.full == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "22.16.0"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run legacy python gates
        run: pnpm verify:m1
        env:
          M1_STAGES: compliance,legacy-pytest,legacy-compile
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-evidence-legacy
          path: test-results/m1-evidence/
          retention-days: 7
          if-no-files-found: ignore

  # 浏览器 E2E 验收：独立作业并行执行，Chromium 走缓存，避免每次重装 130MB 浏览器
  e2e:
    name: 浏览器 E2E 验收（Playwright）
    needs: changes
    if: needs.changes.outputs.docs_only == 'false' && (needs.changes.outputs.e2e == 'true' || needs.changes.outputs.full == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://storyforge:storyforge@127.0.0.1:5433/storyforge_test
      TEST_DATABASE_URL: postgresql://storyforge:storyforge@127.0.0.1:5433/storyforge_test
      REDIS_URL: redis://127.0.0.1:6380
      PORT: 3001
      WEB_ORIGIN: http://127.0.0.1:5173
      SESSION_TTL_SECONDS: 604800
      # 仓库未配置 M0_AUTHOR_* secret 时回退到内置测试账号；prepare-e2e 会在测试库自举该 author（幂等）
      AUTHOR_EMAIL: ${{ secrets.M0_AUTHOR_EMAIL || 'ci-author@example.com' }}
      AUTHOR_DISPLAY_NAME: M1 CI Author
      AUTHOR_PASSWORD: ${{ secrets.M0_AUTHOR_PASSWORD || 'ci-author-pass-1234' }}
      M1_ALLOW_DATABASE_RESTART: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "22.16.0"
      - name: Start disposable pgvector PostgreSQL 16 and Redis 7
        run: |
          docker volume create infra_storyforge_pg
          docker compose -f infra/docker-compose.yml up -d postgres --wait
          docker compose -f infra/docker-compose.yml exec -T postgres psql -U storyforge -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE storyforge_test"
          docker compose -f infra/docker-compose.yml up -d redis --wait
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      # Playwright 版本随 pnpm-lock.yaml 锁定，锁文件变化时缓存自动失效
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      # ubuntu-24.04 runner 镜像已预装 Playwright 系统依赖（日志可见全部 "already the newest version"），
      # 命中浏览器缓存时无需再次 apt-get，直接复用缓存中的 Chromium
      - name: Install Chromium (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Reuse cached Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install chromium
      - name: Check required author secrets without printing them
        run: node -e "for (const key of ['AUTHOR_EMAIL','AUTHOR_PASSWORD']) { if (!process.env[key]) throw new Error(key + ' repository secret is required'); }"
      - name: Run browser acceptance
        run: pnpm verify:m1
        env:
          M1_STAGES: docker,browser
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-evidence-e2e
          path: test-results/m1-evidence/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-browser-evidence
          path: |
            playwright-report/
            test-results/playwright/
          retention-days: 14
          if-no-files-found: ignore

  # 全链路验收报告：仅聚合各并行作业产出的证据，不再重复执行 lint / test / build
  # 触发规则：只在主干合并（push）或手动触发时生成；PR 阶段不运行 m1，避免精简模式下出现 skipped 的必需检查
  m1:
    name: M0–M3c 全链路验收（含浏览器 E2E）
    needs: [changes, quality, test, legacy, e2e]
    if: always() && github.event_name != 'pull_request' && needs.changes.outputs.full == 'true' && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "22.16.0"
      # 报告作业只读取其它作业上传的证据，无需安装依赖
      - name: Download stage evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: m1-evidence-*
          merge-multiple: true
          path: test-results/m1-evidence
      - name: Render M0–M3c acceptance report
        run: pnpm verify:m1
        env:
          M1_REPORT_ONLY: "1"
      - name: Upload M0–M3c evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-writing-foundation-evidence
          path: |
            test-results/
            playwright-report/
            docs/05-测试与验收报告/M1写作基座验收报告.md
          retention-days: 14
          if-no-files-found: ignore
