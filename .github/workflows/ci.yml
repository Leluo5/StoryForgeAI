name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # 快速静态门禁：无数据库 / Redis / secrets 依赖，所有 PR（含 fork）都能在分钟级得到类型与构建反馈
  quality:
    name: 静态质量门禁（lint / typecheck / build）
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Enable pnpm 10.12.4
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate
          node --version
          pnpm --version
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  # 单元与 API E2E 门禁：守护 M0–M3c 全部 vitest 用例（含 api e2e-spec），独立于浏览器 E2E，失败定位更直接
  test:
    name: 单元与 API E2E 测试（vitest）
    runs-on: ubuntu-22.04
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://storyforge:storyforge@127.0.0.1:5433/storyforge_test
      TEST_DATABASE_URL: postgresql://storyforge:storyforge@127.0.0.1:5433/storyforge_test
      REDIS_URL: redis://127.0.0.1:6380
      AUTHOR_EMAIL: ${{ secrets.M0_AUTHOR_EMAIL }}
      AUTHOR_DISPLAY_NAME: M1 CI Author
      AUTHOR_PASSWORD: ${{ secrets.M0_AUTHOR_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Enable pnpm 10.12.4
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate
      - name: Start disposable PostgreSQL 16
        run: docker compose -f infra/docker-compose.yml up -d postgres --wait
      - name: Create isolated test database
        run: docker compose -f infra/docker-compose.yml exec -T postgres psql -U storyforge -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE storyforge_test"
      - name: Start disposable Redis 7
        run: docker compose -f infra/docker-compose.yml up -d redis --wait
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check required author secrets without printing them
        run: node -e "for (const key of ['AUTHOR_EMAIL','AUTHOR_PASSWORD']) { if (!process.env[key]) throw new Error(key + ' repository secret is required'); }"
      - name: Run unit and API E2E tests
        run: pnpm test
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-api-e2e-evidence
          path: |
            test-results/
          retention-days: 7

  # 全链路验收：在静态 + 单测门禁之上，补浏览器 E2E（Playwright）与旧体系 pytest，归档验收证据
  m1:
    name: M0–M3c 全链路验收（含浏览器 E2E）
    runs-on: ubuntu-22.04
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://storyforge:storyforge@127.0.0.1:5433/storyforge_test
      TEST_DATABASE_URL: postgresql://storyforge:storyforge@127.0.0.1:5433/storyforge_test
      REDIS_URL: redis://127.0.0.1:6380
      PORT: 3001
      WEB_ORIGIN: http://127.0.0.1:5173
      SESSION_TTL_SECONDS: 604800
      AUTHOR_EMAIL: ${{ secrets.M0_AUTHOR_EMAIL }}
      AUTHOR_DISPLAY_NAME: M1 CI Author
      AUTHOR_PASSWORD: ${{ secrets.M0_AUTHOR_PASSWORD }}
      M1_ALLOW_DATABASE_RESTART: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Enable pnpm 10.12.4
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate
          node --version
          pnpm --version
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Start disposable PostgreSQL 16
        run: docker compose -f infra/docker-compose.yml up -d postgres --wait
      - name: Create isolated test database
        run: docker compose -f infra/docker-compose.yml exec -T postgres psql -U storyforge -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE storyforge_test"
      - name: Start disposable Redis 7
        run: docker compose -f infra/docker-compose.yml up -d redis --wait
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check required author secrets without printing them
        run: node -e "for (const key of ['AUTHOR_EMAIL','AUTHOR_PASSWORD']) { if (!process.env[key]) throw new Error(key + ' repository secret is required'); }"
      - name: Run complete M0–M3c verification
        run: pnpm verify:m1
      - name: Upload M0–M3c evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-writing-foundation-evidence
          path: |
            test-results/
            playwright-report/
            docs/05-测试与验收报告/M1写作基座验收报告.md
          retention-days: 14
